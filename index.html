<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZingSpeed Mobile - Kỷ Lục Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: #06080c;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-wrapper {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    .btn-admin-login {
      background: #111622;
      color: #f7a618;
      border: 2px solid #233148;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-admin-login:hover {
      border-color: #f7a618;
    }

    .admin-panel {
      background: #111622;
      border: 2px solid #f7a618;
      border-radius: 8px;
      padding: 15px;
      display: none;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-title {
      font-size: 16px;
      font-weight: 800;
      color: #f7a618;
      margin-bottom: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid #233148;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-logout {
      background: #3d1c24;
      color: #ff4d5a;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }

    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      background: #080a0e;
      border: 1px solid #2c3e5e;
      color: #fff;
      padding: 8px 10px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 13px;
      width: 100%;
    }

    input:focus {
      outline: none;
      border-color: #00ffcc;
    }

    .file-input-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-input-wrapper label {
      font-size: 11px;
      color: #8da1bc;
      font-weight: 700;
      text-transform: uppercase;
    }

    input[type="file"] {
      padding: 5px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-add {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #000;
      background: #00ffcc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      grid-column: 1 / -1;
    }

    .btn-add:hover {
      background: #33ffd6;
    }

    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
    }

    .map-card {
      background: #111622;
      border: 2px solid #233148;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }

    .map-card:hover {
      border-color: #00ffcc;
      transform: translateY(-3px);
    }

    .map-card-img-wrap {
      width: 100%;
      height: 130px;
      background: #05080e;
      position: relative;
    }

    .map-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .map-card-title {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      padding: 20px 12px 6px 12px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .map-card-body {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .map-card-count {
      font-size: 12px;
      color: #8da1bc;
      font-weight: 700;
      text-transform: uppercase;
    }

    .map-card-top1 {
      font-size: 13px;
      color: #f7a618;
      font-weight: 800;
    }

    .leaderboard-container {
      background: #111622;
      border: 2px solid #233148;
      border-radius: 8px;
      padding: 20px;
    }

    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #233148;
      padding-bottom: 10px;
    }

    .btn-back {
      background: #2c3e5e;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .btn-back:hover {
      background: #3d547d;
    }

    .ranking-table {
      width: 100%;
      border-collapse: collapse;
    }

    .ranking-table th, .ranking-table td {
      padding: 10px 12px;
      text-align: left;
      font-size: 14px;
    }

    .ranking-table th {
      background: #080a0e;
      color: #8da1bc;
      text-transform: uppercase;
      font-weight: 800;
      border-bottom: 2px solid #233148;
    }

    .ranking-table tr {
      border-bottom: 1px solid #1a2436;
    }

    .ranking-table tr:hover {
      background: #161e2e;
    }

    .rank-num {
      font-weight: 800;
      width: 60px;
    }

    .rank-1 { color: #ffd700; font-weight: 800; }
    .rank-2 { color: #c0c0c0; font-weight: 800; }
    .rank-3 { color: #cd7f32; font-weight: 800; }

    .player-highlight {
      color: #00ffcc;
      font-weight: 800;
    }

    .time-highlight {
      color: #f7a618;
      font-weight: 800;
      font-style: italic;
    }

    .btn-del-row {
      background: #3d1c24;
      color: #ff4d5a;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 800;
      font-size: 11px;
      display: none;
    }

    .admin-mode .btn-del-row {
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="app-wrapper" id="app-root">
  <div class="top-bar">
    <button class="btn-admin-login" id="btn-admin-toggle" onclick="toggleAdminMode()">🔐 Đăng Nhập QTV</button>
  </div>

  <div class="admin-panel" id="admin-panel">
    <div class="admin-title">
      <span>⚙️ Bảng Điều Khiển Quản Trị Viên (QTV)</span>
      <button class="btn-logout" onclick="toggleAdminMode()">Đăng Xuất</button>
    </div>
    <div class="inputs-grid">
      <input type="text" id="input-map" placeholder="Tên Map (VD: Bến Xe Điện)">
      <input type="text" id="input-player" placeholder="Tên Tay Đua">
      <input type="text" id="input-time" placeholder="Thời Gian (VD: 1:20.50)">
      <div class="file-input-wrapper">
        <label>Chọn Ảnh Map Từ Thiết Bị</label>
        <input type="file" id="input-img-file" accept="image/*">
      </div>
      <button class="btn-add" onclick="addRecord()">THÊM KỶ LỤC MỚI</button>
    </div>
  </div>

  <div id="view-maps" class="view-section active">
    <div class="admin-title" style="border:none; margin-bottom:15px; color:#f7a618;">🏁 Danh Sách Bản Đồ Kỷ Lục</div>
    <div class="map-grid" id="map-grid-container"></div>
  </div>

  <div id="view-leaderboard" class="view-section">
    <div class="leaderboard-container">
      <div class="leaderboard-header">
        <span id="current-map-title" style="font-size: 18px; font-weight: 800; color: #f7a618; text-transform: uppercase;">BXH MAP</span>
        <button class="btn-back" onclick="showMapView()">⬅ Quay Lại Danh Sách Map</button>
      </div>
      <div id="leaderboard-content"></div>
    </div>
  </div>
</div>

<script>
  let leaderboardData = [];
  let currentSelectedMap = "";
  let isAdmin = false;
  const ADMIN_PASSWORD = "ataravens"; // Mật khẩu mới đã được cập nhật

  function loadData() {
    const saved = localStorage.getItem('zingspeed_map_secure_data');
    if (saved) {
      try { leaderboardData = JSON.parse(saved); } catch(e) { leaderboardData = []; }
    } else {
      leaderboardData = [
        { map: "Bến Xe Điện", player: "KingSpeed", time: "1:18.25", seconds: 78.25, img: "" },
        { map: "Bến Xe Điện", player: "SpeedQueen", time: "1:19.10", seconds: 79.10, img: "" },
        { map: "Đường Sông", player: "KingSpeed", time: "1:12.00", seconds: 72.00, img: "" }
      ];
      saveData();
    }
  }

  function saveData() {
    localStorage.setItem('zingspeed_map_secure_data', JSON.stringify(leaderboardData));
  }

  function toggleAdminMode() {
    if (!isAdmin) {
      const pass = prompt("Nhập mật khẩu Quản Trị Viên (QTV):");
      if (pass === ADMIN_PASSWORD) {
        isAdmin = true;
        document.getElementById('admin-panel').classList.add('active');
        document.getElementById('app-root').classList.add('admin-mode');
        document.getElementById('btn-admin-toggle').innerText = "🛡️ Đang ở chế độ QTV";
        alert("Đăng nhập QTV thành công!");
      } else if (pass !== null) {
        alert("Sai mật khẩu!");
      }
    } else {
      isAdmin = false;
      document.getElementById('admin-panel').classList.remove('active');
      document.getElementById('app-root').classList.remove('admin-mode');
      document.getElementById('btn-admin-toggle').innerText = "🔐 Đăng Nhập QTV";
      alert("Đã thoát chế độ QTV!");
    }
    if (currentSelectedMap) {
      renderLeaderboard(currentSelectedMap);
    }
  }

  function timeToSeconds(timeStr) {
    try {
      const parts = timeStr.split(':');
      return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
    } catch (e) {
      return 999999;
    }
  }

  function addRecord() {
    if (!isAdmin) return alert("Bạn không có quyền thực hiện thao tác này!");

    const map = document.getElementById('input-map').value.trim();
    const player = document.getElementById('input-player').value.trim();
    const time = document.getElementById('input-time').value.trim();
    const fileInput = document.getElementById('input-img-file');

    if (!map || !player || !time) {
      alert("Vui lòng nhập đầy đủ Tên Map, Tên Tay Đua và Thời gian!");
      return;
    }

    const seconds = timeToSeconds(time);

    if (fileInput.files && fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        saveRecordData(map, player, time, seconds, e.target.result);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      let existingImg = "";
      const found = leaderboardData.find(item => item.map.toLowerCase() === map.toLowerCase() && item.img);
      if (found) existingImg = found.img;

      saveRecordData(map, player, time, seconds, existingImg);
    }
  }

  function saveRecordData(map, player, time, seconds, img) {
    leaderboardData.push({ map, player, time, seconds, img });
    saveData();

    document.getElementById('input-map').value = "";
    document.getElementById('input-player').value = "";
    document.getElementById('input-time').value = "";
    document.getElementById('input-img-file').value = "";

    renderMapList();
    if (currentSelectedMap.toLowerCase() === map.toLowerCase()) {
      renderLeaderboard(currentSelectedMap);
    }
    alert("Thêm kỷ lục thành công!");
  }

  function deleteRecord(indexInGlobal) {
    if (!isAdmin) return alert("Bạn cần đăng nhập QTV để xóa!");
    if (confirm("Xóa kỷ lục này của tay đua?")) {
      leaderboardData.splice(indexInGlobal, 1);
      saveData();
      renderMapList();
      renderLeaderboard(currentSelectedMap);
    }
  }

  function renderMapList() {
    const container = document.getElementById('map-grid-container');
    container.innerHTML = "";

    const mapGroups = {};
    leaderboardData.forEach(item => {
      if (!mapGroups[item.map]) {
        mapGroups[item.map] = { records: [], img: item.img || "" };
      }
      mapGroups[item.map].records.push(item);
      if (!mapGroups[item.map].img && item.img) {
        mapGroups[item.map].img = item.img;
      }
    });

    const uniqueMaps = Object.keys(mapGroups);

    if (uniqueMaps.length === 0) {
      container.innerHTML = `<div style="color: #8da1bc; font-style: italic; grid-column: 1/-1;">Chưa có bản đồ nào được thêm.</div>`;
      return;
    }

    const defaultImg = "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=500&q=80";

    uniqueMaps.forEach(mapName => {
      const group = mapGroups[mapName];
      group.records.sort((a, b) => a.seconds - b.seconds);
      const top1 = group.records[0];
      const mapImg = group.img || defaultImg;

      container.innerHTML += `
        <div class="map-card" onclick="openMapDetail('${mapName}')">
          <div class="map-card-img-wrap">
            <img src="${mapImg}" class="map-card-img" onerror="this.src='${defaultImg}'">
            <div class="map-card-title">🗺️ ${mapName}</div>
          </div>
          <div class="map-card-body">
            <div class="map-card-count">${group.records.length} Kỷ Lục</div>
            <div class="map-card-top1">👑 ${top1.player}: ${top1.time}</div>
          </div>
        </div>
      `;
    });
  }

  function openMapDetail(mapName) {
    currentSelectedMap = mapName;
    document.getElementById('view-maps').classList.remove('active');
    document.getElementById('view-leaderboard').classList.add('active');
    renderLeaderboard(mapName);
  }

  function showMapView() {
    document.getElementById('view-leaderboard').classList.remove('active');
    document.getElementById('view-maps').classList.add('active');
    renderMapList();
  }

  function renderLeaderboard(mapName) {
    document.getElementById('current-map-title').innerText = `BXH MAP: ${mapName.toUpperCase()}`;
    const container = document.getElementById('leaderboard-content');

    let matchedRecords = [];
    leaderboardData.forEach((item, globalIndex) => {
      if (item.map.toLowerCase() === mapName.toLowerCase()) {
        matchedRecords.push({ ...item, globalIndex });
      }
    });

    matchedRecords.sort((a, b) => a.seconds - b.seconds);

    if (matchedRecords.length === 0) {
      container.innerHTML = `<div style="text-align: center; color: #8da1bc; padding: 20px;">Không có dữ liệu kỷ lục nào.</div>`;
      return;
    }

    let html = `
      <table class="ranking-table">
        <thead>
          <tr>
            <th class="rank-num">Hạng</th>
            <th>Tay Đua</th>
            <th>Thời Gian Kỷ Lục</th>
            <th style="text-align: right;">Thao Tác</th>
          </tr>
        </thead>
        <tbody>
    `;

    matchedRecords.forEach((item, idx) => {
      let rankClass = "";
      if (idx === 0) rankClass = "rank-1";
      else if (idx === 1) rankClass = "rank-2";
      else if (idx === 2) rankClass = "rank-3";

      let rankDisplay = `#${idx + 1}`;
      if (idx === 0) rankDisplay = `👑 #1`;

      html += `
        <tr>
          <td class="rank-num ${rankClass}">${rankDisplay}</td>
          <td class="player-highlight">${item.player}</td>
          <td class="time-highlight">⏱️ ${item.time}</td>
          <td style="text-align: right;">
            <button class="btn-del-row" onclick="deleteRecord(${item.globalIndex})">XÓA</button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadData();
    renderMapList();
  });
</script>

</body>
</html>
